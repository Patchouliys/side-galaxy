[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "side-galaxy"
version = "0.1.0"
description = "A modular control plane for embedded multi-core experiments"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "mcp>=1.26,<2"]

[project.scripts]
sg = "side_galaxy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/side_galaxy"]
