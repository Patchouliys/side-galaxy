[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "side-galaxy"
version = "0.1.0"
description = "A modular control plane for embedded multi-core experiments"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "native/vendor/nlohmann/LICENSE.MIT"]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "mcp>=1.26,<2"]

[project.scripts]
sg = "side_galaxy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/side_galaxy"]
exclude = ["src/side_galaxy/_native/*"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/native", "/CMakeLists.txt", "/hatch_build.py", "/pyproject.toml", "/README.md", "/README.zh-CN.md", "/LICENSE", "/THIRD_PARTY.md", "/docs/native-build.md"]
exclude = ["src/side_galaxy/_native", "native/build", "**/__pycache__", "**/*.pyc"]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "hatch_build.py" },
  { file = "CMakeLists.txt" },
  { file = "native/**/*.cpp" },
  { file = "native/**/*.h" },
  { file = "native/**/*.hpp" },
  { env = "MACOSX_DEPLOYMENT_TARGET" },
  { env = "CC" },
  { env = "CXX" },
  { env = "CXXFLAGS" },
]
