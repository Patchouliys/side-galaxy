all:
  children:
    galaxy_boards:
      hosts:
        pi4:
          ansible_host: 192.0.2.41
          galaxy_config: ../.data/pi4-agent.json
          galaxy_domain: galaxy-experiment
        pi5:
          ansible_host: 192.0.2.51
          galaxy_config: ../.data/pi5-agent.json
          galaxy_domain: galaxy-experiment
      vars:
        ansible_user: laboperator
        galaxy_system: linux-kvm
        # Build on a compatible Linux distribution for each target architecture.
        galaxy_wheels:
          aarch64: ../dist/side_galaxy-0.1.0-py3-none-linux_aarch64.whl
          x86_64: ../dist/side_galaxy-0.1.0-py3-none-linux_x86_64.whl
        # A host can override galaxy_wheel directly when it uses a different build.
        galaxy_wheel: "{{ galaxy_wheels.get(ansible_facts.architecture, '') }}"
