---
- name: Install Side Galaxy agents on an enrolled Linux fleet
  hosts: galaxy_boards
  become: true
  serial: 4
  tasks:
    - name: Check declared operating system family
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == 'Debian'
          - galaxy_config is defined
          - galaxy_wheel is defined
          - galaxy_wheel | length > 0
          - galaxy_wheel | basename is match('^side_galaxy-.*\.whl$')
          - not galaxy_wheel.endswith('-any.whl')
        fail_msg: This bootstrap playbook supports Debian-family Linux; add another OS playbook for other systems.
    - name: Require controller wheelhouse for offline deployment
      ansible.builtin.assert:
        that:
          - galaxy_wheelhouse is defined
          - galaxy_wheelhouse | default('') | length > 0
        fail_msg: Offline deployment requires galaxy_wheelhouse with all pinned dependencies as target-compatible wheels.
      when: galaxy_offline | default(false) | bool
    - name: Check offline wheelhouse on controller
      ansible.builtin.stat:
        path: "{{ galaxy_wheelhouse if galaxy_wheelhouse.startswith('/') else playbook_dir ~ '/' ~ galaxy_wheelhouse }}"
      register: galaxy_wheelhouse_stat
      delegate_to: localhost
      become: false
      when: galaxy_offline | default(false) | bool
    - name: Require a local wheelhouse directory
      ansible.builtin.assert:
        that:
          - galaxy_wheelhouse_stat.stat.isdir | default(false)
        fail_msg: galaxy_wheelhouse must name an existing directory on the Ansible controller.
      when: galaxy_offline | default(false) | bool
    - name: Check preinstalled offline Python and native runtimes
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "import ctypes, ensurepip, venv; ctypes.CDLL('libsqlite3.so.0'); ctypes.CDLL('libstdc++.so.6')"
      changed_when: false
      when: galaxy_offline | default(false) | bool
    - name: Check preinstalled offline libvirt client when requested
      ansible.builtin.command:
        argv: [virsh, --version]
      changed_when: false
      when:
        - galaxy_offline | default(false) | bool
        - galaxy_system | default('linux-process') == 'linux-kvm'
    - name: Install Python and native library runtimes
      ansible.builtin.apt:
        name: [python3-venv, python3-pip, libsqlite3-0, libstdc++6]
        state: present
        update_cache: true
      when: not (galaxy_offline | default(false) | bool)
    - name: Install KVM client only when requested
      ansible.builtin.apt:
        name: libvirt-clients
        state: present
      when:
        - not (galaxy_offline | default(false) | bool)
        - galaxy_system | default('linux-process') == 'linux-kvm'
    - name: Create runtime account
      ansible.builtin.user:
        name: galaxy
        system: true
        create_home: true
        home: /var/lib/side-galaxy
    - name: Create installation directory
      ansible.builtin.file:
        path: /opt/side-galaxy
        state: directory
        mode: '0755'
    - name: Copy built wheel
      ansible.builtin.copy:
        src: '{{ galaxy_wheel }}'
        dest: '/opt/side-galaxy/{{ galaxy_wheel | basename }}'
        mode: '0644'
      notify: Restart agent
    - name: Copy pinned dependencies
      ansible.builtin.copy:
        src: requirements.txt
        dest: /opt/side-galaxy/requirements.txt
        mode: '0644'
      notify: Restart agent
    - name: Copy private offline wheelhouse
      ansible.builtin.copy:
        src: '{{ galaxy_wheelhouse_stat.stat.path }}/'
        dest: /opt/side-galaxy/wheelhouse/
        mode: '0600'
        directory_mode: '0700'
      when: galaxy_offline | default(false) | bool
      notify: Restart agent
    - name: Create virtual environment
      ansible.builtin.command:
        cmd: python3 -m venv /opt/side-galaxy/venv
        creates: /opt/side-galaxy/venv/bin/python
    - name: Install pinned dependencies
      ansible.builtin.pip:
        requirements: /opt/side-galaxy/requirements.txt
        virtualenv: /opt/side-galaxy/venv
        extra_args: --require-hashes
      when: not (galaxy_offline | default(false) | bool)
    - name: Install pinned dependencies from offline wheels
      ansible.builtin.command:
        argv:
          - /opt/side-galaxy/venv/bin/python
          - -m
          - pip
          - install
          - --no-index
          - --find-links=/opt/side-galaxy/wheelhouse
          - '--only-binary=:all:'
          - --require-hashes
          - -r
          - /opt/side-galaxy/requirements.txt
      environment:
        PIP_CONFIG_FILE: /dev/null
        PIP_DISABLE_PIP_VERSION_CHECK: '1'
      register: galaxy_offline_dependencies
      changed_when: "'Successfully installed' in galaxy_offline_dependencies.stdout"
      when: galaxy_offline | default(false) | bool
      notify: Restart agent
    - name: Install application wheel
      ansible.builtin.pip:
        name: '/opt/side-galaxy/{{ galaxy_wheel | basename }}'
        virtualenv: /opt/side-galaxy/venv
        extra_args: --no-deps --force-reinstall
      when: not (galaxy_offline | default(false) | bool)
      notify: Restart agent
    - name: Install application wheel offline
      ansible.builtin.command:
        argv:
          - /opt/side-galaxy/venv/bin/python
          - -m
          - pip
          - install
          - --no-index
          - '--only-binary=:all:'
          - --no-deps
          - --force-reinstall
          - '/opt/side-galaxy/{{ galaxy_wheel | basename }}'
      environment:
        PIP_CONFIG_FILE: /dev/null
        PIP_DISABLE_PIP_VERSION_CHECK: '1'
      when: galaxy_offline | default(false) | bool
      notify: Restart agent
    - name: Install board-specific private credentials
      ansible.builtin.copy:
        src: '{{ galaxy_config }}'
        dest: /var/lib/side-galaxy/agent.json
        owner: galaxy
        group: galaxy
        mode: '0600'
      no_log: true
      notify: Restart agent
    - name: Install service
      ansible.builtin.template:
        src: galaxy-agent.service.j2
        dest: /etc/systemd/system/galaxy-agent.service
        mode: '0644'
      notify: Restart agent
    - name: Start agent
      ansible.builtin.systemd_service:
        name: galaxy-agent
        enabled: true
        state: started
        daemon_reload: true
  handlers:
    - name: Restart agent
      ansible.builtin.systemd_service:
        name: galaxy-agent
        state: restarted
        daemon_reload: true
